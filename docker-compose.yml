name: opspilot
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opspilot -d opspilot']
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.13
    container_name: opspilot-ollama
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
